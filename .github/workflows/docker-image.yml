name: Build & Push Frontend Image

# Build image Docker frontend di CI lalu push ke GitHub Container Registry (GHCR).
# VPS cukup `docker compose pull` (tak perlu build sendiri → VPS ringan).
#
# WAJIB set repository VARIABLE (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_API_URL = https://DOMAIN_PRODUKSI/api/v1
# (nilai ini di-inline saat build & dipakai browser, jadi harus domain publik final).

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nama image (lowercase — syarat GHCR)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
